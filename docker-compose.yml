name: hw4

x-lab: &lab
  build: .
  image: hw4-lab:local
  init: true

services:
  agent-node:
    <<: *lab
    command: ["sleep", "infinity"]
    volumes:
      - ./mock_skill.sh:/app/mock_skill.sh:ro
      - ./fake_secrets.txt:/app/fake_secrets.txt:ro
    networks:
      hw4net:
        ipv4_address: 172.30.0.10

  web-lab:
    <<: *lab
    command:
      - python
      - -m
      - http.server
      - "8000"
      - --bind
      - 0.0.0.0
      - --directory
      - /web
    volumes:
      - ./web:/web:ro
    networks:
      hw4net:
        ipv4_address: 172.30.0.40

  mock-c2:
    <<: *lab
    command: ["python", "-u", "/app/c2.py"]
    volumes:
      - ./c2.py:/app/c2.py:ro
      - c2-data:/data
    networks:
      hw4net:
        ipv4_address: 172.30.0.66

networks:
  hw4net:
    name: hw4net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-hw4
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  c2-data:
